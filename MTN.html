<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Agent Record System</title>
    <style>
        :root {
            --mtn-yellow: #ffcc00;
            --mtn-black: #000000;
            --airtel-red: #e60000;
            --primary-color: var(--mtn-yellow);
            --text-color: var(--mtn-black);
            --bg-color: #f4f4f9;
            --border-color: #ccc;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: var(--bg-color);
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Header & Branding */
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-placeholder {
            width: 45px;
            height: 45px;
            background: var(--primary-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            font-weight: bold;
            font-size: 14px;
        }

        .agent-setup {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        input, select, button {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }

        button {
            background-color: var(--primary-color);
            color: var(--text-color);
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: opacity 0.2s;
        }

        button:hover { opacity: 0.8; }

        /* Auto-detected Data Panel */
        .meta-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #e9ecef;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
        }

        .meta-label {
            font-weight: bold;
            color: #6c757d;
            font-size: 11px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .meta-value {
            font-weight: bold;
            color: #212529;
        }

        /* Search Section */
        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 6px;
            align-items: center;
        }

        #search-input { flex: 1; }

        .btn-save {
            background: #28a745 !important; 
            color: white !important;
        }

        .btn-clear {
            background: #6c757d !important;
            color: white !important;
        }

        /* Table Styling */
        .table-responsive { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            background: white;
        }

        th, td {
            border: 1px solid #999;
            padding: 8px;
            text-align: left;
            font-size: 13px;
        }

        th {
            background-color: #f1f3f5;
            font-weight: bold;
            text-transform: uppercase;
        }

        td input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 13px;
            padding: 4px;
        }

        td input:focus { background: #fff3cd; }
        td select { width: 100%; padding: 4px; border: none; background: transparent; outline: none; }

        /* Hidden elements */
        .hidden { display: none !important; }

        /* Airtel Theme */
        .airtel-theme {
            --primary-color: var(--airtel-red);
            --text-color: #ffffff;
        }
        .airtel-theme .logo-placeholder {
            background: var(--airtel-white);
            color: var(--airtel-red);
            border: 2px solid var(--airtel-red);
        }
    </style>
</head>
<body>

<div class="container" id="app-container">
    
    <!-- Header -->
    <div class="header-top">
        <div class="brand">
            <div class="logo-placeholder" id="network-logo">MTN</div>
            <span id="network-title">MoMo Agent Record</span>
        </div>
        
        <div class="agent-setup">
            <select id="network-select" onchange="toggleNetwork()">
                <option value="MTN">MTN Agent</option>
                <option value="Airtel">Airtel Agent</option>
            </select>
            <input type="tel" id="agent-phone" placeholder="Agent Phone No.">
            <input type="text" id="agent-code" placeholder="Agent Code">
            <button onclick="connectWhatsApp()">Connect WhatsApp</button>
        </div>
    </div>

    <!-- Auto-detected Meta Data -->
    <div class="meta-panel">
        <div class="meta-item">
            <span class="meta-label">Date</span>
            <span class="meta-value" id="auto-date">--</span>
        </div>
        <div class="meta-item">
            <span class="meta-label">Time</span>
            <span class="meta-value" id="auto-time">--</span>
        </div>
        <div class="meta-item">
            <span class="meta-label">Location</span>
            <span class="meta-value" id="auto-location">Detecting...</span>
        </div>
        <div class="meta-item">
            <span class="meta-label">Currency</span>
            <select id="currency-select" style="padding: 2px; border-radius: 4px; font-weight: bold; border: none; background: transparent; outline: none;">
                <option value="NGN">NGN (Nigeria)</option>
                <option value="GHS">GHS (Ghana)</option>
                <option value="UGX">UGX (Uganda)</option>
                <option value="KES">KES (Kenya)</option>
                <option value="ZAR">ZAR (South Africa)</option>
                <option value="XOF">XOF (West Africa)</option>
            </select>
        </div>
        <div class="meta-item">
            <span class="meta-label">Page Serial No.</span>
            <span class="meta-value" id="auto-serial" style="color: #d9534f; font-size: 16px;">168</span>
        </div>
    </div>

    <!-- Search Section -->
    <div class="search-section">
        <input type="text" id="search-input" placeholder="Search by Phone Number, Date (YYYY-MM-DD), or Page Serial...">
        <button onclick="searchRecords()">Search</button>
        <button class="btn-clear" onclick="clearSearch()">Clear</button>
        <button class="btn-save" onclick="saveRecord()" style="margin-left: auto;">Save Page</button>
    </div>

    <!-- Search Results (Hidden by default) -->
    <div id="search-results-container" class="hidden">
        <h3 style="color: #d9534f; margin-top: 0;">Search Results</h3>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Page Serial</th>
                        <th>Date</th>
                        <th>Network</th>
                        <th>Phone No.</th>
                        <th>Txn Type</th>
                        <th>Amount</th>
                        <th>Customer ID</th>
                    </tr>
                </thead>
                <tbody id="search-results-body"></tbody>
            </table>
        </div>
        <hr style="border: 1px solid #ccc; margin: 20px 0;">
    </div>

    <!-- Data Entry Table -->
    <div id="entry-table-container" class="table-responsive">
        <table id="record-table">
            <thead>
                <tr>
                    <th style="width: 50px;">No.</th>
                    <th>Phone No.</th>
                    <th style="width: 80px;">Txn Type</th>
                    <th>Amount</th>
                    <th>Customer ID</th>
                    <th>Customer Signature</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <!-- Rows generated by JavaScript -->
            </tbody>
        </table>
    </div>

</div>

<script>
    // --- State Variables ---
    const totalRows = 20;
    let currentSerial = 168;
    let currentLocation = "Detecting...";
    let timeInterval = null;

    // --- 1. Initialization & Auto-Detection ---
    function generateTable() {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = ''; // Clear existing
        for (let i = 1; i <= totalRows; i++) {
            let row = document.createElement('tr');
            row.innerHTML = `
                <td style="text-align:center; font-weight:bold;">${i}.</td>
                <td><input type="tel" class="input-phone" placeholder="Phone"></td>
                <td>
                    <select class="input-type">
                        <option value="D">D</option>
                        <option value="W">W</option>
                        <option value="A">A</option>
                    </select>
                </td>
                <td><input type="number" class="input-amount" placeholder="Amount"></td>
                <td><input type="text" class="input-id" placeholder="ID"></td>
                <td><input type="text" class="input-sign" placeholder="Sign"></td>
            `;
            tbody.appendChild(row);
        }
    }

    function detectDateTime() {
        const updateTime = () => {
            const now = new Date();
            document.getElementById('auto-date').innerText = now.toLocaleDateString();
            document.getElementById('auto-time').innerText = now.toLocaleTimeString();
        };
        updateTime();
        if (timeInterval) clearInterval(timeInterval);
        timeInterval = setInterval(updateTime, 1000);
    }

    function detectLocation() {
        const locEl = document.getElementById('auto-location');
        if (!navigator.geolocation) {
            currentLocation = "Not Supported";
            locEl.innerText = currentLocation;
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude.toFixed(4);
                const lon = position.coords.longitude.toFixed(4);
                currentLocation = `Lat: ${lat}, Lon: ${lon}`;
                locEl.innerText = currentLocation;
            },
            (error) => {
                currentLocation = "Permission Denied";
                locEl.innerText = currentLocation;
            },
            { timeout: 5000 }
        );
    }

    function detectCurrency() {
        try {
            const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const select = document.getElementById('currency-select');
            
            if (timeZone.includes('Lagos')) select.value = 'NGN';
            else if (timeZone.includes('Accra')) select.value = 'GHS';
            else if (timeZone.includes('Kampala')) select.value = 'UGX';
            else if (timeZone.includes('Nairobi')) select.value = 'KES';
            else if (timeZone.includes('Johannesburg')) select.value = 'ZAR';
            else if (timeZone.includes('Abidjan') || timeZone.includes('Dakar')) select.value = 'XOF';
        } catch (e) {
            console.warn("Currency detection failed, using default.");
        }
    }

    function loadSerial() {
        try {
            const savedSerial = localStorage.getItem('nextPageSerial');
            if (savedSerial && !isNaN(savedSerial)) {
                currentSerial = parseInt(savedSerial, 10);
            }
        } catch (e) {
            console.warn("LocalStorage unavailable.");
        }
        document.getElementById('auto-serial').innerText = currentSerial;
    }

    // --- 2. UI Interactions ---
    function toggleNetwork() {
        const network = document.getElementById('network-select').value;
        const container = document.getElementById('app-container');
        const logo = document.getElementById('network-logo');
        const title = document.getElementById('network-title');

        if (network === 'Airtel') {
            container.classList.add('airtel-theme');
            logo.innerText = 'Airtel';
            title.innerText = 'Airtel Money Agent Record';
        } else {
            container.classList.remove('airtel-theme');
            logo.innerText = 'MTN';
            title.innerText = 'MoMo Agent Record';
        }
    }

    function connectWhatsApp() {
        const phoneInput = document.getElementById('agent-phone').value.trim();
        const codeInput = document.getElementById('agent-code').value.trim();
        
        if (!phoneInput) {
            alert("Please enter the Agent Phone Number first.");
            return;
        }

        const cleanPhone = phoneInput.replace(/\D/g, '');
        if (cleanPhone.length < 10) {
            alert("Please enter a valid phone number (at least 10 digits).");
            return;
        }

        const message = encodeURIComponent(`Hello, I am an Agent. My Agent Code is: ${codeInput || 'N/A'}`);
        window.open(`https://wa.me/${cleanPhone}?text=${message}`, '_blank');
    }

    // --- 3. Data Management ---
    function saveRecord() {
        const network = document.getElementById('network-select').value;
        const agentPhone = document.getElementById('agent-phone').value.trim();
        const agentCode = document.getElementById('agent-code').value.trim();
        const currency = document.getElementById('currency-select').value;
        
        // Construct timestamp data
        const now = new Date();
        const dateStr = now.toLocaleDateString();
        const isoDateStr = now.toISOString().split('T')[0]; // YYYY-MM-DD for reliable searching
        const timeStr = now.toLocaleTimeString();
        
        // Collect table data
        const rows = document.querySelectorAll('#table-body tr');
        const records = [];
        
        rows.forEach((row, index) => {
            const phone = row.querySelector('.input-phone').value.trim();
            const type = row.querySelector('.input-type').value;
            const amount = row.querySelector('.input-amount').value.trim();
            const customerId = row.querySelector('.input-id').value.trim();
            const signature = row.querySelector('.input-sign').value.trim();

            if (phone || amount || customerId) {
                records.push({
                    rowNo: index + 1,
                    phone, type, amount, customerId, signature
                });
            }
        });

        if (records.length === 0) {
            alert("No data to save. Please fill out at least one row.");
            return;
        }

        const pageData = {
            network,
            serial: currentSerial.toString(),
            date: dateStr,
            isoDate: isoDateStr,
            time: timeStr,
            location: currentLocation,
            agentPhone,
            agentCode,
            currency,
            records
        };

        try {
            let allData = JSON.parse(localStorage.getItem('agentRecords')) || [];
            allData.push(pageData);
            localStorage.setItem('agentRecords', JSON.stringify(allData));
            
            // Increment Serial
            currentSerial++;
            localStorage.setItem('nextPageSerial', currentSerial);
            document.getElementById('auto-serial').innerText = currentSerial;

            alert(`Data saved successfully for Page Serial: ${pageData.serial}. Moved to next page (${currentSerial}).`);
            
            // Reset form
            document.querySelectorAll('#table-body input').forEach(input => input.value = '');
            document.querySelectorAll('#table-body select').forEach(select => select.selectedIndex = 0);
        } catch (e) {
            alert("Error saving data. Your browser's local storage might be full or disabled.");
        }
    }

    function searchRecords() {
        const query = document.getElementById('search-input').value.toLowerCase().trim();
        if (!query) {
            alert("Please enter a search term.");
            return;
        }

        let allData = [];
        try {
            allData = JSON.parse(localStorage.getItem('agentRecords')) || [];
        } catch (e) {
            alert("Could not retrieve records.");
            return;
        }

        let results = [];

        allData.forEach(page => {
            let pageMatch = false;
            
            // Match by Serial, Display Date, or ISO Date
            if (page.serial.includes(query) || 
                page.date.toLowerCase().includes(query) || 
                page.isoDate.includes(query)) {
                pageMatch = true;
            }

            // Match by Phone Number
            let matchingRows = [];
            page.records.forEach(rec => {
                if (rec.phone.toLowerCase().includes(query)) {
                    pageMatch = true;
                    matchingRows.push(rec);
                }
            });

            if (pageMatch) {
                results.push({
                    serial: page.serial,
                    date: page.date,
                    network: page.network,
                    rows: matchingRows.length > 0 ? matchingRows : page.records
                });
            }
        });

        if (results.length === 0) {
            alert("No records found for: " + query);
            return;
        }

        // Populate Search Results UI
        const resultsContainer = document.getElementById('search-results-container');
        const resultsBody = document.getElementById('search-results-body');
        resultsBody.innerHTML = '';
        
        results.forEach(res => {
            res.rows.forEach(rec => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight:bold;">Page ${res.serial}</td>
                    <td>${res.date}</td>
                    <td>${res.network}</td>
                    <td>${rec.phone || '-'}</td>
                    <td>${rec.type}</td>
                    <td>${rec.amount || '-'}</td>
                    <td>${rec.customerId || '-'}</td>
                `;
                resultsBody.appendChild(tr);
            });
        });

        // Toggle UI
        resultsContainer.classList.remove('hidden');
        document.getElementById('entry-table-container').classList.add('hidden');
    }

    function clearSearch() {
        document.getElementById('search-input').value = '';
        document.getElementById('search-results-container').classList.add('hidden');
        document.getElementById('entry-table-container').classList.remove('hidden');
    }

    // --- Run on Load ---
    window.addEventListener('DOMContentLoaded', () => {
        generateTable();
        detectDateTime();
        detectCurrency();
        loadSerial();
        
        // Delay geolocation slightly to ensure DOM is fully ready and browser doesn't block it immediately
        setTimeout(detectLocation, 500);
    });
</script>

</body>
</html>
